[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonetopc"
dynamic = ["version"]
description = "Official Python client for phonetopc: stream Android phone sensor events to your PC"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "phonetopc contributors" }]
keywords = ["android", "sensors", "websocket", "json-rpc", "gyro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
# websockets 13.0 introduced the websockets.asyncio API used here. pip picks
# the newest release that supports the running interpreter (15.x on 3.9).
dependencies = ["websockets>=13.0,<18"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.18",
    "ruff",
    "mypy",
]

[project.scripts]
# Named -py so it never shadows the Go `phonetopc` CLI from pcd/.
phonetopc-py = "phonetopc.cli:main"

[tool.hatch.version]
path = "src/phonetopc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/phonetopc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "FA"]

[tool.mypy]
# Current mypy can't target 3.9 any more. 3.9 compatibility is covered by
# ruff's target-version and by running the test suite on 3.9.
python_version = "3.10"
strict = true
files = ["src/phonetopc"]
